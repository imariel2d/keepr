<a class="skip-link" href="#main-content">Skip to content</a>

<header class="topbar">
  <div class="brand">
    @if (auth.isAuthenticated()) {
      <cove-icon-button
        class="menu-btn"
        icon="menu"
        label="Open navigation menu"
        [ariaExpanded]="drawerOpen()"
        ariaControls="nav-drawer"
        (click)="toggleDrawer()" />
    }
    <img class="logo" src="cove-mark.svg" alt="" width="34" height="34" aria-hidden="true" />
    <span class="name">Keepr</span>
  </div>

  @if (auth.isAuthenticated()) {
    <form class="search" role="search" (submit)="$event.preventDefault(); submitSearch()">
      <cove-icon class="search-icon" name="search" [size]="18" aria-hidden="true" />
      <label class="sr-only" for="topbar-search">Search files and folders</label>
      <input
        id="topbar-search"
        type="search"
        class="search-input"
        placeholder="Search files and folders"
        autocomplete="off"
        [value]="searchTerm()"
        (input)="onSearchInput($any($event.target).value)" />
      @if (searchTerm()) {
        <button type="button" class="search-clear" aria-label="Clear search" (click)="clearSearch()">
          <cove-icon name="x" [size]="16" aria-hidden="true" />
        </button>
      }
    </form>
  }

  <div class="actions">
    <cove-icon-button
      [icon]="theme.theme() === 'dark' ? 'sun' : 'moon'"
      [label]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      (click)="theme.toggle()" />

    @if (auth.isAuthenticated()) {
      <cove-button variant="ghost" size="sm" icon="log-out" (click)="logout()">Log out</cove-button>
    }
  </div>
</header>

@if (auth.isAuthenticated()) {
  <div class="shell">
    <aside class="side">
      <cove-sidebar
        brand="Keepr"
        brandMark="cove-mark.svg"
        [items]="navItems()"
        [active]="section()"
        [showUpload]="false"
        [quotaUsed]="usedPercent()"
        [quotaTotal]="100"
        [quotaLabel]="quotaLabel()"
        [quotaNote]="quotaNote()"
        (navigate)="navigate($event)" />
    </aside>
    <main id="main-content" tabindex="-1" class="content">
      <router-outlet />
    </main>
  </div>

  @if (drawerOpen()) {
    <div class="drawer-scrim" (click)="closeDrawer()"></div>
    <div #drawer id="nav-drawer" class="drawer" role="dialog" aria-modal="true"
         aria-label="Navigation" tabindex="-1">
      <cove-sidebar
        brand="Keepr"
        brandMark="cove-mark.svg"
        [items]="navItems()"
        [active]="section()"
        [showUpload]="false"
        [quotaUsed]="usedPercent()"
        [quotaTotal]="100"
        [quotaLabel]="quotaLabel()"
        [quotaNote]="quotaNote()"
        (navigate)="navigate($event)" />
    </div>
  }
} @else {
  <main id="main-content" tabindex="-1" class="content content--centered">
    <router-outlet />
  </main>
}

<!-- Fixed, app-level: uploads keep running across navigation. -->
<app-upload-toast />
