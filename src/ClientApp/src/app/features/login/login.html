<section class="auth">
  <div class="auth-card">
    <div class="head">
      <img class="mark" src="cove-mark.svg" alt="" width="56" height="56" aria-hidden="true" />
      <h1 i18n="@@login.title">Welcome back</h1>
      <p class="sub" i18n="@@login.subtitle">Sign in to your Keepr account.</p>
    </div>

    <form (submit)="submit($event)">
      <div class="field">
        <label for="email" i18n="@@login.email.label">Email</label>
        <cove-input
          icon="mail"
          type="email"
          name="email"
          autocomplete="email"
          placeholder="you@example.com"
          i18n-placeholder="@@login.email.placeholder"
          [value]="email()"
          (valueChange)="email.set($event)" />
      </div>

      <div class="field">
        <label for="password" i18n="@@login.password.label">Password</label>
        <cove-input
          icon="lock"
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          autocomplete="current-password"
          placeholder="••••••••"
          [value]="password()"
          (valueChange)="password.set($event)">
          <button
            trailing
            type="button"
            class="reveal"
            [attr.aria-label]="revealLabel()"
            [attr.aria-pressed]="showPassword()"
            (click)="showPassword.set(!showPassword())">
            @if (showPassword()) {
              <cove-icon name="eye-off" [size]="16"></cove-icon>
            } @else {
              <cove-icon name="eye" [size]="16"></cove-icon>
            }
          </button>
        </cove-input>
      </div>

      <div class="forgot">
        @if (selfServiceReset()) {
          <a routerLink="/forgot-password" i18n="@@login.forgot.link">Forgot password?</a>
        } @else {
          <span class="muted" i18n="@@login.forgot.admin">Forgot your password? Contact your admin to reset it.</span>
        }
      </div>

      @if (error()) {
        <p class="error" role="alert">
          <cove-icon name="alert-circle" [size]="15"></cove-icon>
          {{ error() }}
        </p>
      }

      <cove-button variant="primary" size="lg" [disabled]="busy()" class="submit">
        {{ submitLabel() }}
      </cove-button>
    </form>

    <p class="switch" i18n="@@login.no_account">
      Need an account? Ask a Keepr admin to set one up for you.
    </p>

    <div class="lang-row">
      <app-language-switcher (localeSelect)="locale.switchTo($event)" />
    </div>
  </div>
</section>
