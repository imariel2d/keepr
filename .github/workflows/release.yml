name: Release

# release-please watches main: it maintains a "release" PR from the Conventional-Commit history,
# and merging that PR tags the new version, updates CHANGELOG.md, and creates the GitHub Release.
# Only then does the image job build and push the container to GHCR. A tag/release created with the
# built-in GITHUB_TOKEN does NOT trigger a second workflow (loop guard), so the build is gated here
# in the same run rather than on a separate `release:`/tag trigger. See docs/testing-strategy.md's
# sibling note and the README "Releases & registry" section.
on:
  push:
    branches: [main]

# CI (ci.yml) stays read-only; the write scopes live only in this release workflow.
permissions:
  contents: write        # create the tag + the GitHub Release
  pull-requests: write   # open/maintain the release PR
  packages: write        # push the image to GHCR

# Never cancel a release mid-flight; a superseded run just no-ops (no release to cut).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Cut release (when commits warrant)
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Build & push image to GHCR
    needs: release-please
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Build the exact commit the release tag points at, not the tip of main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # no PAT needed

      # This workflow runs on `push: main`, so the ref isn't the tag itself — feed the release tag
      # to metadata-action explicitly so the semver patterns parse it.
      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}   # → ghcr.io/imariel2d/keepr
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }}
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
