name: CI

# Runs on every push to main and on every pull request. Coverage is reported as an artifact but
# never gates the build — only a failing test fails CI. See docs/testing-strategy.md.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: .NET unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/Api.Tests/Api.Tests.csproj

      - name: Test (with coverage)
        run: >
          dotnet test tests/Api.Tests/Api.Tests.csproj
          --no-restore
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=unit.trx"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: ./TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  # Phase 2 adds an `e2e` job here: bring up docker-compose + Mailpit, then run Playwright against
  # http://localhost:4200. See docs/testing-strategy.md.
